<li class="post-item" data-title="{{ post.title }}" data-tags="{{ post.tags | join(' ') }}" data-category="{{ post.platform }}" data-platform="{{ post.platform }}" data-difficulty="{{ post.difficulty | lower }}" data-platform-name="{{ post.platform_name | lower }}">
  <div class="post-meta"><time datetime="{{ post.date }}">{{ post.display_date }}</time><span>·</span><a href="{{ post.section_url }}">{{ post.platform_name }}</a><span>·</span><span>{{ post.difficulty }}</span><span>·</span><span>{{ post.read_time }} min</span></div>
  <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
  <p>{{ post.summary }}</p>
  <div class="tag-cloud" style="margin-top:.6rem">{% for tag in post.tags %}<a class="tag" href="{{ base }}/writeups/?tag={{ tag | urlencode }}">{{ tag }}</a>{% endfor %}</div>
</li>
